<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHLE RideMate - Trip Calendar & Attendance</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .calendar-wrapper {
            background-color: white;
            border-radius: var(--bs-border-radius);
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            padding: 1.5rem;
        }
        .calendar-header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            padding: 0.5rem 0;
            color: var(--bs-secondary);
        }
        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid var(--bs-border-color);
            border-radius: 0.375rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .calendar-day:hover:not(.empty) {
            background-color: var(--bs-light);
        }
        .calendar-day.empty {
            background-color: #f8f9fa;
            border-color: transparent;
            cursor: default;
        }
        .calendar-day.today {
            border-color: var(--bs-primary);
            background-color: rgba(13, 110, 253, 0.05);
        }
        .calendar-day.today .day-number {
            background-color: var(--bs-primary);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .day-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 5px;
        }
        .day-indicator.trip { background-color: var(--bs-success); }
        .day-indicator.partial { background-color: var(--bs-warning); }
        .day-indicator.cancelled { background-color: var(--bs-danger); }
        .day-indicator.wfh { background-color: var(--bs-info); }
        .day-indicator.leave { background-color: var(--bs-orange, #fd7e14); }
        .day-indicator.nocarpool { background-color: var(--bs-secondary); }
        .day-indicator.no-trip { background-color: transparent; }
    </style>
</head>
<body>
    <nav id="sidebar" class="sidebar"></nav>
    <main class="main-content">
        <header id="topbar" class="top-bar"></header>
        <div class="page-content">
            <h2 class="mb-4">Trip Calendar</h2>

            <div class="calendar-wrapper">
                <div class="calendar-header-nav">
                    <button class="btn btn-outline-secondary" id="prevMonthBtn">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <h4 class="mb-0" id="currentMonthDisplay">September 2026</h4>
                    <button class="btn btn-outline-secondary" id="nextMonthBtn">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>

                <div class="calendar-grid">
                    <div class="calendar-day-header">Sun</div>
                    <div class="calendar-day-header">Mon</div>
                    <div class="calendar-day-header">Tue</div>
                    <div class="calendar-day-header">Wed</div>
                    <div class="calendar-day-header">Thu</div>
                    <div class="calendar-day-header">Fri</div>
                    <div class="calendar-day-header">Sat</div>
                </div>
                <div class="calendar-grid" id="calendarDays">
                    <!-- Days loaded here -->
                </div>
            </div>
        </div>
    </main>
    <nav id="bottomnav" class="bottom-nav"></nav>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090;"></div>

    <!-- Day Details Modal -->
    <div class="modal fade" id="dayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dayModalTitle">Trip Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="dayModalBody">
                    <!-- Content injected here -->
                </div>
                <div class="modal-footer" id="dayModalFooter">
                    <!-- Actions injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
