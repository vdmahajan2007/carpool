<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trip Tracking - Carpool Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="track-page">
    <!-- Track Header -->
    <header class="track-header">
        <div class="brand"><i class="bi bi-car-front-fill"></i> Carpool Tracker</div>
        <span id="trackLiveBadge" class="live-badge d-none"><span class="live-dot"></span> LIVE</span>
    </header>

    <!-- Trip Info Bar -->
    <div class="track-info-bar" id="tripInfoBar">
        <div class="track-info-item"><i class="bi bi-person-fill"></i> Driver: <strong id="trackDriverName">—</strong></div>
        <div class="track-info-item"><i class="bi bi-flag-fill"></i> Status: <strong id="trackStatus">Loading...</strong></div>
        <div class="track-info-item"><i class="bi bi-clock"></i> Started: <strong id="trackStartTime">—</strong></div>
        <div class="track-info-item"><i class="bi bi-arrow-repeat"></i> Updated: <strong id="trackLastUpdated">—</strong></div>
        <div class="track-info-item" id="trackAccuracyRow"><i class="bi bi-geo-alt"></i> GPS: <span id="trackAccuracy" class="gps-accuracy">—</span></div>
    </div>

    <!-- Map -->
    <div id="trackMap" class="track-map" style="margin:0.75rem; height: 400px;"></div>

    <!-- Error/Ended state -->
    <div id="trackError" class="empty-state d-none text-center p-5">
        <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
        <h5 id="trackErrorTitle">Trip Not Found</h5>
        <p id="trackErrorMsg">This tracking link is invalid or the trip has ended.</p>
    </div>

    <!-- Offline Banner -->
    <div id="offlineBanner" class="offline-banner d-none p-2 bg-danger text-white text-center">
        <i class="bi bi-wifi-off me-1"></i> Internet connection unavailable.
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090;"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Handle offline status
            window.addEventListener('online', () => document.getElementById('offlineBanner').classList.add('d-none'));
            window.addEventListener('offline', () => document.getElementById('offlineBanner').classList.remove('d-none'));
            if (!navigator.onLine) {
                document.getElementById('offlineBanner').classList.remove('d-none');
            }

            const tripId = new URLSearchParams(window.location.search).get('trip');
            const errorContainer = document.getElementById('trackError');
            const mapContainer = document.getElementById('trackMap');
            const infoBar = document.getElementById('tripInfoBar');
            const liveBadge = document.getElementById('trackLiveBadge');
            
            const driverNameEl = document.getElementById('trackDriverName');
            const statusEl = document.getElementById('trackStatus');
            const startTimeEl = document.getElementById('trackStartTime');
            const lastUpdatedEl = document.getElementById('trackLastUpdated');
            const accuracyEl = document.getElementById('trackAccuracy');

            function showError(title, msg) {
                mapContainer.classList.add('d-none');
                infoBar.classList.add('d-none');
                liveBadge.classList.add('d-none');
                errorContainer.classList.remove('d-none');
                document.getElementById('trackErrorTitle').textContent = title;
                document.getElementById('trackErrorMsg').textContent = msg;
            }

            if (!tripId) {
                showError('Trip Not Found', 'No trip ID was provided in the URL.');
                return;
            }

            let map = null;
            let marker = null;
            let userPanned = false;
            let lastUpdateTimestamp = 0;
            let updateTimer = null;

            function formatTimeAgo(ms) {
                if (!ms) return '—';
                const seconds = Math.floor((Date.now() - ms) / 1000);
                if (seconds < 5) return 'Just now';
                if (seconds < 60) return `${seconds}s ago`;
                const mins = Math.floor(seconds / 60);
                return `${mins}m ago`;
            }

            // Start update timer for time ago string
            updateTimer = setInterval(() => {
                if (lastUpdateTimestamp) {
                    lastUpdatedEl.textContent = formatTimeAgo(lastUpdateTimestamp);
                    if (marker && marker.getPopup() && marker.getPopup().isOpen()) {
                        marker.setPopupContent(`<b>${driverNameEl.textContent}</b><br/>Last updated: ${formatTimeAgo(lastUpdateTimestamp)}`);
                    }
                }
            }, 1000);

            // Connect to Firebase RTDB
            const db = firebase.database();
            const tripRef = db.ref('liveTrips/' + tripId);

            tripRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (!data || data.status !== 'active') {
                    showError('Trip Ended', 'This trip has ended or cannot be found.');
                    tripRef.off('value');
                    clearInterval(updateTimer);
                    return;
                }

                if (data.expiresAt < Date.now()) {
                    showError('Link Expired', 'This tracking link has expired.');
                    tripRef.off('value');
                    clearInterval(updateTimer);
                    return;
                }

                // Update UI elements
                driverNameEl.textContent = data.driverName || 'Unknown';
                statusEl.textContent = 'Active';
                lastUpdateTimestamp = data.timestamp;
                lastUpdatedEl.textContent = formatTimeAgo(lastUpdateTimestamp);
                liveBadge.classList.remove('d-none');
                
                if (data.startTime) {
                    const d = new Date(data.startTime);
                    startTimeEl.textContent = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                } else {
                    startTimeEl.textContent = '—';
                }

                // Update accuracy display
                const acc = data.accuracy;
                if (acc !== undefined && acc !== null) {
                    let className = 'poor';
                    let text = `±${Math.round(acc)}m (Low)`;
                    if (acc < 30) {
                        className = 'good';
                        text = `±${Math.round(acc)}m (Good)`;
                    } else if (acc <= 100) {
                        className = 'medium';
                        text = `±${Math.round(acc)}m (Fair)`;
                    }
                    accuracyEl.className = `gps-accuracy text-${className === 'good' ? 'success' : (className === 'medium' ? 'warning' : 'danger')}`;
                    accuracyEl.textContent = text;
                }

                const lat = data.lat;
                const lng = data.lng;

                if (!map && lat && lng) {
                    // Initialize Map
                    map = L.map('trackMap').setView([lat, lng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    marker = L.marker([lat, lng]).addTo(map);
                    marker.bindPopup(`<b>${data.driverName || 'Driver'}</b><br/>Last updated: Just now`);

                    map.on('dragstart', () => { userPanned = true; });
                } else if (map && lat && lng) {
                    marker.setLatLng([lat, lng]);
                    if (!userPanned) {
                        map.setView([lat, lng]);
                    }
                }
            }, (error) => {
                showError('Error', 'Failed to connect to tracking data. Please try again.');
                console.error(error);
            });
        });
    </script>
</body>
</html>
