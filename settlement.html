<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHLE RideMate - Monthly Settlements</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="sidebar" class="sidebar"></nav>
    <main class="main-content">
        <header id="topbar" class="top-bar"></header>
        <div class="page-content container-fluid py-3">
            
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                <div>
                    <h1 class="h4 fw-bold mb-0">Monthly Settlement & Dues</h1>
                    <span class="text-muted small">Zero-profit expense reconciliation & payments</span>
                </div>
                <button id="exportBtn" class="btn btn-outline-secondary btn-sm shadow-sm rounded-pill px-3">
                    <i class="bi bi-download me-1"></i> Export CSV
                </button>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6 col-sm-4 col-md-3">
                    <label class="form-label text-muted small fw-bold">SELECT MONTH</label>
                    <select id="monthSelect" class="form-select shadow-sm rounded-3"></select>
                </div>
                <div class="col-6 col-sm-4 col-md-3">
                    <label class="form-label text-muted small fw-bold">SELECT YEAR</label>
                    <select id="yearSelect" class="form-select shadow-sm rounded-3"></select>
                </div>
            </div>

            <div id="settlementsContainer" class="d-flex flex-column gap-3">
                <!-- Settlement cards will be injected here -->
            </div>

        </div>
    </main>
    <nav id="bottomnav" class="bottom-nav"></nav>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090;"></div>

    <!-- Record Payment Modal -->
    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom">
                    <div class="d-flex align-items-center gap-2">
                        <div class="p-2 rounded-3 bg-primary-subtle text-primary">
                            <i class="bi bi-wallet2 fs-5"></i>
                        </div>
                        <h5 class="modal-title fw-bold mb-0">Record Payment</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="paymentForm">
                        <input type="hidden" id="paymentPersonId">
                        <input type="hidden" id="payPersonId">
                        <div class="mb-3">
                            <label class="form-label">Passenger Name</label>
                            <input type="text" id="paymentPersonName" class="form-control fw-bold bg-light" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="paymentAmount" class="form-label">Amount Received</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" id="paymentAmount" class="form-control form-control-lg fw-bold text-primary" step="0.01" min="0.01" required placeholder="0.00">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="paymentDate" class="form-label">Payment Date</label>
                            <input type="date" id="paymentDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="paymentMethod" class="form-label">Payment Method</label>
                            <select id="paymentMethod" class="form-select" required>
                                <option value="UPI" selected>UPI (GPay / PhonePe / Paytm)</option>
                                <option value="Cash">Cash</option>
                                <option value="Bank Transfer">Bank Transfer (NEFT/IMPS)</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="paymentNotes" class="form-label">Notes (Optional)</label>
                            <textarea id="paymentNotes" class="form-control" rows="2" placeholder="e.g. Paid via PhonePe"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top bg-light p-3">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm" id="savePaymentBtn">
                        <i class="bi bi-check2-circle me-1"></i> Save Payment
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Payment Modal -->
    <div class="modal fade" id="deletePaymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold text-danger"><i class="bi bi-trash3 me-2"></i>Delete Payment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    Are you sure you want to delete this payment record? This action will restore the pending due balance.
                </div>
                <div class="modal-footer border-top bg-light p-3">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4 shadow-sm" id="confirmDeletePaymentBtn">Delete Record</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/settlement.js"></script>
</body>
</html>
