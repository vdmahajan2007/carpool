<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People - Carpool Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .person-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .person-card.inactive {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <nav id="sidebar" class="sidebar"></nav>
    <main class="main-content">
        <header id="topbar" class="top-bar"></header>
        <div class="page-content container-fluid py-3">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h4 mb-0">People</h1>
                <button id="addPersonBtn" class="btn btn-primary btn-sm">
                    <i class="bi bi-person-plus"></i> Add Person
                </button>
            </div>

            <div id="peopleContainer" class="row g-3">
                <!-- Person cards will be injected here -->
            </div>

        </div>
    </main>
    <nav id="bottomnav" class="bottom-nav"></nav>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090;"></div>

    <!-- Add/Edit Person Modal -->
    <div class="modal fade" id="personModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="personModalTitle">Add Person</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="personForm">
                        <input type="hidden" id="personId">
                        <div class="mb-3">
                            <label for="personName" class="form-label">Name <span class="text-danger">*</span></label>
                            <input type="text" id="personName" class="form-control" required minlength="2">
                        </div>
                        <div class="mb-3">
                            <label for="personPhone" class="form-label">Phone Number (Optional)</label>
                            <input type="tel" id="personPhone" class="form-control" placeholder="+919876543210">
                            <div class="form-text">Include country code (e.g. +91) for WhatsApp links.</div>
                        </div>
                        <div class="mb-3">
                            <label for="personRole" class="form-label">Role</label>
                            <select id="personRole" class="form-select">
                                <option value="Passenger">Passenger</option>
                                <option value="Driver">Driver</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="personDistance" class="form-label">Home to Office Distance (km) <span class="text-danger">*</span></label>
                            <input type="number" id="personDistance" class="form-control" step="0.1" min="0.1" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="personActive" checked>
                            <label class="form-check-label" for="personActive">Active</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="savePersonBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Person Modal -->
    <div class="modal fade" id="deletePersonModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete <strong id="deletePersonName"></strong>? 
                    This will not remove their past trip records, but they will no longer be available for new trips.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeletePersonBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/people.js"></script>
</body>
</html>
