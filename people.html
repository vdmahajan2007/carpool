<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People - Carpool Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="sidebar" class="sidebar"></nav>
    <main class="main-content">
        <header id="topbar" class="top-bar"></header>
        <div class="page-content container-fluid py-3">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h4 mb-1 fw-bold">People Management</h1>
                    <p class="text-muted small mb-0">Manage driver, passengers, locations, and pickup distances.</p>
                </div>
                <button id="addPersonBtn" class="btn btn-primary rounded-pill px-3">
                    <i class="bi bi-person-plus-fill me-1"></i> Add Person
                </button>
            </div>

            <div id="peopleContainer" class="row g-3">
                <!-- Person cards will be injected here -->
            </div>

        </div>
    </main>
    <nav id="bottomnav" class="bottom-nav"></nav>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090;"></div>

    <!-- Add/Edit Person Modal -->
    <div class="modal fade" id="personModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="personModalTitle">Add Person</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="personForm">
                        <input type="hidden" id="personId">
                        
                        <div class="row g-2 mb-3">
                            <div class="col-8">
                                <label for="personName" class="form-label small fw-bold">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="personName" class="form-control" placeholder="e.g. Harsha" required minlength="2">
                            </div>
                            <div class="col-4">
                                <label for="personRole" class="form-label small fw-bold">Role</label>
                                <select id="personRole" class="form-select">
                                    <option value="Passenger">Passenger</option>
                                    <option value="Driver">Driver</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="personPhone" class="form-label small fw-bold">Phone Number (For WhatsApp Reminders)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-whatsapp text-success"></i></span>
                                <input type="tel" id="personPhone" class="form-control" placeholder="+919876543210">
                            </div>
                            <div class="form-text small">Include country code (e.g. +91) for direct WhatsApp messaging.</div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="personDistance" class="form-label small fw-bold">Home to Office (km) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" id="personDistance" class="form-control" step="0.1" min="0.1" placeholder="e.g. 16" required>
                                    <span class="input-group-text">km</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <label for="personPickupDistance" class="form-label small fw-bold">Default Pickup Dist (km)</label>
                                <div class="input-group">
                                    <input type="number" id="personPickupDistance" class="form-control" step="0.1" min="0.1" placeholder="e.g. 16">
                                    <span class="input-group-text">km</span>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="personHomeLocation" class="form-label small fw-bold">Home Location</label>
                                <input type="text" id="personHomeLocation" class="form-control form-control-sm" placeholder="e.g. Kothrud, Pune">
                            </div>
                            <div class="col-6">
                                <label for="personPickupLocation" class="form-label small fw-bold">Pickup Landmark</label>
                                <input type="text" id="personPickupLocation" class="form-control form-control-sm" placeholder="e.g. Near Bus Stand">
                            </div>
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input type="checkbox" class="form-check-input" id="personActive" checked>
                            <label class="form-check-label fw-semibold" for="personActive">Active Member (Available for trips)</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" id="savePersonBtn">Save Person</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Person Modal -->
    <div class="modal fade" id="deletePersonModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to remove <strong id="deletePersonName"></strong>? Past trip logs will remain intact.
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger rounded-pill px-3" id="confirmDeletePersonBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/people.js"></script>
</body>
</html>
