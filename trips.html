<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trips - Carpool Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .trip-type-pill, .status-pill {
            cursor: pointer;
        }
        .passenger-check label {
            cursor: pointer;
        }
        .summary-card {
            background-color: var(--bs-light);
            border-radius: var(--bs-border-radius);
            padding: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav id="sidebar" class="sidebar"></nav>
    <main class="main-content">
        <header id="topbar" class="top-bar"></header>
        <div class="page-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manage Trips</h2>
                <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#tripFormCard" aria-expanded="true" aria-controls="tripFormCard">
                    <i class="bi bi-plus-lg"></i> Add Trip
                </button>
            </div>

            <div class="row">
                <div class="col-lg-4 mb-4">
                    <!-- Form Card -->
                    <div class="card collapse show d-lg-block" id="tripFormCard">
                        <div class="card-header bg-white">
                            <h5 class="card-title mb-0" id="formTitle">Log New Trip</h5>
                        </div>
                        <div class="card-body">
                            <form id="tripForm">
                                <input type="hidden" id="tripId">
                                
                                <div class="mb-3">
                                    <label for="tripDate" class="form-label">Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="tripDate" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Trip Type <span class="text-danger">*</span></label>
                                    <div class="d-flex flex-wrap gap-2" id="tripTypeContainer">
                                        <input type="radio" class="btn-check" name="tripType" id="typeOffice" value="Office" required>
                                        <label class="btn btn-outline-primary trip-type-pill" for="typeOffice">Office</label>
                                        
                                        <input type="radio" class="btn-check" name="tripType" id="typeReturn" value="Return">
                                        <label class="btn btn-outline-primary trip-type-pill" for="typeReturn">Return</label>
                                        
                                        <input type="radio" class="btn-check" name="tripType" id="typeFullDay" value="Full Day" checked>
                                        <label class="btn btn-outline-primary trip-type-pill" for="typeFullDay">Full Day</label>
                                        
                                        <input type="radio" class="btn-check" name="tripType" id="typeCustom" value="Custom">
                                        <label class="btn btn-outline-primary trip-type-pill" for="typeCustom">Custom</label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Status <span class="text-danger">*</span></label>
                                    <div class="d-flex flex-wrap gap-2">
                                        <input type="radio" class="btn-check" name="tripStatus" id="statusCompleted" value="Completed" checked>
                                        <label class="btn btn-outline-success status-pill" for="statusCompleted">Completed</label>

                                        <input type="radio" class="btn-check" name="tripStatus" id="statusCancelled" value="Cancelled">
                                        <label class="btn btn-outline-danger status-pill" for="statusCancelled">Cancelled</label>

                                        <input type="radio" class="btn-check" name="tripStatus" id="statusWFH" value="WFH">
                                        <label class="btn btn-outline-info status-pill" for="statusWFH">WFH</label>

                                        <input type="radio" class="btn-check" name="tripStatus" id="statusLeave" value="Leave">
                                        <label class="btn btn-outline-warning status-pill" for="statusLeave">Leave</label>

                                        <input type="radio" class="btn-check" name="tripStatus" id="statusNoCarpool" value="No Carpool">
                                        <label class="btn btn-outline-secondary status-pill" for="statusNoCarpool">No Carpool</label>
                                    </div>
                                </div>

                                <div class="mb-3" id="passengersSection">
                                    <label class="form-label">Passengers</label>
                                    <div id="passengersContainer" class="d-flex flex-wrap gap-3 p-3 border rounded bg-light">
                                        <!-- Checkboxes dynamically added here -->
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Distance</label>
                                    <div class="input-group mb-2">
                                        <input type="number" class="form-control" id="tripDistance" readonly>
                                        <span class="input-group-text">km</span>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="overrideDistance">
                                        <label class="form-check-label text-muted small" for="overrideDistance">
                                            Override actual distance
                                        </label>
                                    </div>
                                </div>

                                <div class="summary-card mb-3" id="liveCalcSection">
                                    <h6 class="mb-3 border-bottom pb-2">Live Calculation</h6>
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted">Fuel Used:</span>
                                        <strong id="calcFuelUsed">0.00 L</strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-3">
                                        <span class="text-muted">Total Cost:</span>
                                        <strong id="calcFuelCost">₹0.00</strong>
                                    </div>
                                    <div id="calcShares" class="small">
                                        <!-- Dynamic shares -->
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="tripNotes" class="form-label">Notes (Optional)</label>
                                    <textarea class="form-control" id="tripNotes" rows="2" placeholder="Any specific details..."></textarea>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary" id="saveTripBtn">
                                        <i class="bi bi-check-circle"></i> Save Trip
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary d-none" id="cancelEditBtn">
                                        Cancel Edit
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <!-- History Card -->
                    <div class="card h-100">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2 py-3">
                            <h5 class="card-title mb-0">Trip History</h5>
                            <div class="d-flex gap-2 align-items-center">
                                <select id="filterMonth" class="form-select form-select-sm" style="width: auto;">
                                    <!-- Populated dynamically -->
                                </select>
                                <select id="filterYear" class="form-select form-select-sm" style="width: auto;">
                                    <!-- Populated dynamically -->
                                </select>
                                <select id="filterPassenger" class="form-select form-select-sm" style="width: auto;">
                                    <option value="">All Passengers</option>
                                </select>
                                <select id="filterStatus" class="form-select form-select-sm" style="width: auto;">
                                    <option value="">All Statuses</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Cancelled">Cancelled</option>
                                    <option value="WFH">WFH</option>
                                    <option value="Leave">Leave</option>
                                    <option value="No Carpool">No Carpool</option>
                                </select>
                            </div>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive table-container">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Date</th>
                                            <th>Type</th>
                                            <th>Passengers</th>
                                            <th>Distance</th>
                                            <th>Fuel Cost</th>
                                            <th>Status</th>
                                            <th class="text-end">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tripsTableBody">
                                        <!-- Trips loaded here -->
                                    </tbody>
                                </table>
                            </div>
                            <div id="emptyState" class="text-center p-5 d-none">
                                <i class="bi bi-journal-x text-muted" style="font-size: 3rem;"></i>
                                <h5 class="mt-3 text-muted">No trips found</h5>
                                <p class="text-muted small">Try changing the filters or add a new trip.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <nav id="bottomnav" class="bottom-nav"></nav>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090;"></div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Trip</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this trip? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/trips.js"></script>
</body>
</html>
