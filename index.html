<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Carpool Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="css/style.css" rel="stylesheet">
    <style>
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .bg-blue { background-color: #0d6efd; }
        .bg-teal { background-color: #20c997; }
        .bg-orange { background-color: #fd7e14; }
        .bg-green { background-color: #198754; }
        .bg-purple { background-color: #6f42c1; }
        .bg-pink { background-color: #d63384; }
        .stat-label {
            font-size: 14px;
            color: #6c757d;
            font-weight: 500;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
            margin: 4px 0;
        }
        .stat-sub {
            font-size: 12px;
            color: #adb5bd;
        }
        .btn-start-trip {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
            transition: all 0.2s;
        }
        .btn-start-trip:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>
    <nav id="sidebar" class="sidebar"></nav>
    <main class="main-content">
        <header id="topbar" class="top-bar"></header>
        <div class="page-content">
            <div class="container-fluid py-3">
                
                <!-- Stat Cards -->
                <div class="row g-3 mb-4" id="statCards">
                    <!-- Cards injected via JS -->
                </div>

                <!-- Current Trip Section -->
                <div class="row mb-4">
                    <div class="col-12" id="currentTripSection">
                        <!-- Content injected via JS -->
                    </div>
                </div>

                <!-- Quick Trip Entry -->
                <div class="row mb-4 pb-5">
                    <div class="col-12">
                        <div class="card shadow-sm border-0 rounded-4">
                            <div class="card-body">
                                <h5 class="card-title mb-3"><i class="bi bi-journal-plus text-primary me-2"></i>Log Today's Trip</h5>
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-muted small">TRIP TYPE</label>
                                    <div class="d-flex flex-wrap gap-2" id="quickTripTypes">
                                        <input type="radio" class="btn-check" name="quickTripType" id="typeOffice" value="Office" checked>
                                        <label class="btn btn-outline-primary rounded-pill" for="typeOffice">Office</label>
                                        <input type="radio" class="btn-check" name="quickTripType" id="typeReturn" value="Return">
                                        <label class="btn btn-outline-primary rounded-pill" for="typeReturn">Return</label>
                                        <input type="radio" class="btn-check" name="quickTripType" id="typeFullDay" value="Full Day">
                                        <label class="btn btn-outline-primary rounded-pill" for="typeFullDay">Full Day</label>
                                        <input type="radio" class="btn-check" name="quickTripType" id="typeCustom" value="Custom">
                                        <label class="btn btn-outline-primary rounded-pill" for="typeCustom">Custom</label>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold text-muted small">PASSENGERS</label>
                                    <div class="d-flex flex-wrap gap-2" id="quickTripPassengers">
                                        <!-- Checkboxes injected via JS -->
                                    </div>
                                </div>
                                <button class="btn btn-success w-100 rounded-pill fw-bold py-2" id="btnQuickSaveTrip">
                                    <i class="bi bi-check2-circle"></i> Save Quick Trip
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <nav id="bottomnav" class="bottom-nav"></nav>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090;"></div>
    
    <!-- Start Trip Modal -->
    <div class="modal fade" id="startTripModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-broadcast text-danger me-2"></i>Start Live Trip</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-3">Select passengers traveling with you:</p>
                    <div id="startTripPassengers" class="d-flex flex-column gap-2">
                        <!-- Checkboxes injected via JS -->
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4 fw-bold" id="btnConfirmStartTrip">Start Tracking</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tracking.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
